<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Interactive - Morocco 2030</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>

<body>

    <!-- Header -->
                            <header class="header">
        <div class="logo-container">
            <div class="logo-icon">
                <img src="logo.png" alt="Morocco 2030 Logo" class="logo-img">
            </div>
            <div class="logo-text">
                <span class="logo-title">Morocco 2030</span>
                <span class="logo-subtitle">World Cup Guide</span>
            </div>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-item" data-i18n="nav_home">Accueil</a>
            <a href="map.html" class="nav-item" data-i18n="nav_map">Carte</a>
            <a href="matches.html" class="nav-item" data-i18n="nav_matches">Matchs</a>
            <a href="culture.html" class="nav-item" data-i18n="nav_culture">Culture</a>
            <a href="activities.html" class="nav-item" data-i18n="nav_activities">Activit&eacute;s</a>
            <a href="itineraries.html" class="nav-item" data-i18n="nav_itineraries">Itin&eacute;raires</a>
            <a href="services.html" class="nav-item" data-i18n="nav_services">Services</a>
            <a href="chat.html" class="nav-item" data-i18n="nav_chat">Assistant</a>
        </nav>
        <div class="auth-buttons">
            <div class="lang-switcher">
                <button class="lang-btn" id="langBtn">
                    <i class="fa-solid fa-globe"></i>
                    <span id="currentLang">Fran&ccedil;ais</span>
                    <i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="lang-dropdown" id="langDropdown">
                    <a href="#" data-lang="fr" class="active">Fran&ccedil;ais</a>
                    <a href="#" data-lang="en">English</a>
                    <a href="#" data-lang="ar">&#x0627;&#x0644;&#x0639;&#x0631;&#x0628;&#x064a;&#x0629;</a>
                    <a href="#" data-lang="es">Espa&ntilde;ol</a>
                </div>
            </div>
            
            <!-- Notifications Icon -->
            <div class="notification-wrapper">
                <button class="notif-btn" id="notifBtn">
                    <i class="fa-regular fa-bell"></i>
                    <span class="notif-badge-indicator"></span>
                </button>
                <div class="notif-dropdown" id="notifDropdown">
                    <div class="notif-header">
                        <h4 data-i18n="notifications_title">Notifications</h4>
                        <span class="mark-read" data-i18n="mark_all_read">Marquer tout comme lu</span>
                    </div>
                    <div class="notif-list">
                        <!-- Notifications injected via script -->
                    </div>
                </div>
            </div>
            <div id="authContainer" class="auth-buttons-wrapper">
                <!-- Fallback content if JS is slow -->
                <a href="login.html" class="btn-login" data-i18n="login_btn">Connexion</a>
                <a href="signup.html" class="btn-signup" data-i18n="signup_btn">S'inscrire</a>
            </div>
        </div>
    </header>

    <!-- Map Section -->
    <div class="map-wrapper">
        <!-- Filter Bar -->
        <div class="map-filters">
            <button class="filter-btn active" data-filter="all" data-i18n="all">Tout</button>
            <button class="filter-btn" data-filter="stadium" data-i18n="stadiums">Stades</button>
            <button class="filter-btn" data-filter="hotel" data-i18n="hotels">Hôtels</button>
            <button class="filter-btn" data-filter="restaurant" data-i18n="restaurants">Restaurantes</button>
            <button class="filter-btn" data-filter="attraction" data-i18n="attractions">Attractions</button>
        </div>

        <!-- Map Container -->
        <div id="map"></div>

        <!-- Legend -->
        <div class="map-legend">
            <div class="legend-item"><span class="dot stadium"></span><span data-i18n="stadiums">Stades</span></div>
            <div class="legend-item"><span class="dot hotel"></span><span data-i18n="hotels">Hôtels</span></div>
            <div class="legend-item"><span class="dot restaurant"></span><span data-i18n="restaurants">Restaurants</span></div>
            <div class="legend-item"><span class="dot attraction"></span><span data-i18n="attractions">Attractions</span></div>
        </div>

        <!-- KPI Widget -->
        <div class="map-kpi-widget">
            <div class="kpi-icon"><i class="fa-solid fa-map-pin"></i></div>
            <div class="kpi-content">
                <span class="kpi-value" id="kpiValue">0</span>
                <span class="kpi-label" data-i18n="kpi_label">Lieux affichés</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="translations.js"></script>
    <script src="user_actions.js"></script>
    <script src="script.js"></script>
    <script src="auth.js"></script>
</body>

</html>
